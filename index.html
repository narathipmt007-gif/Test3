<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic Tarot - ดูดวงไพ่ทาโรต์ออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
      min-height: 100vh;
      color: #f8fafc;
    }
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* สไตล์เฉพาะสำหรับไพ่ในสำรับด้านล่าง (ใช้ position: relative เพื่อให้แสดงผลทุกหน้าจอแน่นอน) */
    .deck-card-item {
      position: relative;
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 50%, #0f172a 100%);
      border: 2px solid #fbbf24;
      border-radius: 0.5rem;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
      transition: all 0.25s ease;
    }
    .deck-card-item:hover {
      transform: translateY(-6px) scale(1.05);
      box-shadow: 0 8px 20px rgba(251, 191, 36, 0.45);
    }
    .deck-card-item.selected {
      opacity: 0.2;
      pointer-events: none;
      transform: scale(0.88);
      border-color: #64748b;
    }

    /* สไตล์สำหรับการ์ดคำทำนาย 3D Flip */
    .perspective {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 0.75rem;
    }
    .card-back {
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 50%, #0f172a 100%);
      border: 2px solid #fbbf24;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }
    .card-front {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #f59e0b;
    }
    .reversed-icon {
      transform: rotate(180deg);
    }

    /* ผังกระดาน Celtic Cross */
    .celtic-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(68px, 105px));
      grid-template-rows: repeat(4, auto);
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
    }
    .pos-5 { grid-column: 2; grid-row: 1; }
    .pos-4 { grid-column: 1; grid-row: 2 / span 2; }
    .pos-center { grid-column: 2; grid-row: 2 / span 2; position: relative; }
    .pos-6 { grid-column: 3; grid-row: 2 / span 2; }
    .pos-3 { grid-column: 2; grid-row: 4; }
    .pos-10 { grid-column: 4; grid-row: 1; }
    .pos-9  { grid-column: 4; grid-row: 2; }
    .pos-8  { grid-column: 4; grid-row: 3; }
    .pos-7  { grid-column: 4; grid-row: 4; }
    .crossing-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85);
    }
    .crossing-card:hover {
      transform: translate(-50%, -50%) rotate(0deg) scale(1.1);
      z-index: 20;
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-8">
      <p class="text-amber-400 tracking-widest text-sm uppercase font-cinzel mb-1">Celestial Guidance</p>
      <h1 class="text-3xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200 font-cinzel">
        MYSTIC TAROT ONLINE
      </h1>
      <p class="text-slate-400 mt-2 text-sm md:text-base">ตั้งจิตอธิษฐาน เลือกโหมดการทำนาย แล้วหยิบไพ่ด้วยสัญชาตญาณของคุณ (สำรับ 78 ใบ)</p>
    </header>

    <!-- Control Panel -->
    <section class="bg-slate-900/70 backdrop-blur-md border border-slate-800 rounded-2xl p-6 mb-8 shadow-xl">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div class="md:col-span-2">
          <label class="block text-sm text-amber-300 mb-2">คำถามในใจของคุณ (ระบุหรือไม่ก็ได้)</label>
          <input id="questionInput" type="text" placeholder="เช่น การงานในเดือนนี้จะเป็นอย่างไร, ความรักที่กำลังคุยอยู่..." 
            class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition">
        </div>
        <div>
          <label class="block text-sm text-amber-300 mb-2">รูปแบบการเปิดไพ่</label>
          <select id="spreadMode" onchange="resetSession()" 
            class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400 transition">
            <option value="1">ไพ่ 1 ใบ (ดูดวงรายวัน / ฟันธง)</option>
            <option value="3" selected>ไพ่ 3 ใบ (อดีต - ปัจจุบัน - อนาคต)</option>
            <option value="10">ไพ่ 10 ใบ (Celtic Cross เจาะลึก)</option>
          </select>
        </div>
      </div>

      <div class="flex flex-wrap justify-between items-center mt-6 pt-4 border-t border-slate-800 gap-4">
        <div id="statusText" class="text-sm text-amber-200 font-medium">
          กำลังเตรียมสำรับไพ่...
        </div>
        <button type="button" onclick="resetSession()" 
          class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-semibold px-6 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2">
          <span>🔄</span> สับไพ่ใหม่
        </button>
      </div>
    </section>

    <!-- พื้นที่วางสำรับไพ่ 78 ใบ -->
    <section id="deckContainer" class="mb-10 bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4">
      <div id="deckGrid" class="grid grid-cols-6 sm:grid-cols-8 md:grid-cols-10 lg:grid-cols-13 gap-2.5 justify-items-center">
        <!-- ไพ่ทั้ง 78 ใบจะแสดงตรงนี้ -->
      </div>
    </section>

    <!-- พื้นที่แสดงผลคำทำนาย -->
    <section id="readingSection" class="hidden">
      <h2 class="text-2xl font-semibold text-center text-amber-300 mb-6 font-cinzel">
        ✦ คำทำนายของคุณ ✦
      </h2>
      <div id="questionDisplay" class="text-center text-slate-300 italic mb-6"></div>
      
      <!-- กระดาน Celtic Cross -->
      <div id="celticBoardContainer" class="hidden mb-12 overflow-x-auto py-2"></div>

      <!-- การ์ดคำทำนายรายใบ -->
      <div id="selectedCardsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 justify-items-center mb-8"></div>
    </section>
  </div>

  <script>

    const minorArcana = [
